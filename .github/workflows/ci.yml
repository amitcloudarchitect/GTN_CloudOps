name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Release gate (LLD, CI/CD): any data access outside packages/tenancy fails the build.
  # Standard library only, so nothing installed can influence the result.
  data-access-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -I tools/ci/check_data_access.py .

  lint-and-types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy --strict .

  tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci-only-throwaway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CLOUDOPS_TEST_ADMIN_DSN: postgresql://postgres:ci-only-throwaway@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: unit and integration tests
        run: uv run pytest -m "not isolation"
      - name: isolation suite (release gate)
        run: uv run pytest -m isolation
